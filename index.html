<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE LUXE | Premium Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript" defer></script>
    
    <style>
        :root { --gold: #D4AF37; --dark: #0A192F; --white: #FFFFFF; --black: #111111; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: var(--white); overflow-x: hidden; color: var(--black); }

        /* Navigation */
        nav { background: var(--dark); padding: 15px 8%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--gold); color: white; }
        .logo { font-family: 'Cinzel', serif; font-size: 24px; color: var(--gold); letter-spacing: 2px; }
        .staff-link { font-size: 11px; opacity: 0.6; cursor: pointer; text-transform: uppercase; }

        /* Admin Dashboard */
        #admin-panel { display: none; background: #fdfdfd; padding: 40px 8%; border-bottom: 1px solid var(--gold); text-align: center; }
        .form-group { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: center; margin-top: 20px; }
        .form-group input, .form-group select { padding: 12px; border: 1px solid #ddd; border-radius: 4px; min-width: 180px; }

        /* Buttons */
        .btn { background: var(--black); color: white; border: none; padding: 12px 25px; cursor: pointer; text-transform: uppercase; font-size: 12px; transition: 0.3s; border-radius: 4px; }
        .btn:hover { background: var(--gold); color: var(--black); }
        .btn-save { background: var(--gold); color: black; font-weight: 700; }
        .btn-save:disabled { background: #ccc; cursor: not-allowed; }

        /* Product Grid */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { border: 1px solid #eee; position: relative; text-align: center; padding-bottom: 15px; background: #fff; }
        .card img { width: 100%; height: 350px; object-fit: cover; }
        .price { color: var(--gold); font-weight: 700; font-size: 18px; display: block; margin: 10px 0; }

        /* Cart Sidebar */
        #cart-sidebar { position: fixed; right: -100%; top: 0; width: 350px; height: 100%; background: white; z-index: 2000; transition: 0.4s; padding: 30px; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        #cart-sidebar.active { right: 0; }
        .checkout-btn { background: #25D366; color: white; width: 100%; padding: 15px; border: none; font-weight: 700; cursor: pointer; margin-top: 20px; border-radius: 5px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">ELITE LUXE</div>
    <div style="display:flex; align-items:center; gap:20px;">
        <span class="staff-link" onclick="login()">Staff Login</span>
        <div onclick="toggleCart()" style="cursor:pointer; position:relative;">
            <i class="fa fa-shopping-bag" style="font-size:20px;"></i>
            <span id="cart-count" style="position:absolute; top:-10px; right:-10px; background:var(--gold); color:black; font-size:10px; padding:2px 6px; border-radius:50%; font-weight:700;">0</span>
        </div>
    </div>
</nav>

<div id="admin-panel">
    <h2 style="font-family:'Cinzel';">Management Dashboard</h2>
    <div class="form-group">
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price (₹)">
        <select id="pCat">
            <option value="Shirt">Shirt</option>
            <option value="Pant">Pant</option>
            <option value="Kids">Kids Wear</option>
        </select>
        <button type="button" onclick="openWidget()" class="btn">1. Upload Photo</button>
        <input type="hidden" id="pImg">
        <button class="btn btn-save" id="saveBtn" onclick="saveProduct()" disabled>2. Save Item</button>
    </div>
    <p id="status" style="margin-top:10px; color:green; font-weight:600;"></p>
</div>

<div class="container">
    <div class="grid" id="productGrid"></div>
</div>

<div id="cart-sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="font-family:'Cinzel';">Your Bag</h2>
        <i class="fa fa-times" onclick="toggleCart()" style="cursor:pointer;"></i>
    </div>
    <div id="cart-list" style="margin:20px 0;"></div>
    <h3>Total: ₹<span id="total-price">0</span></h3>
    <button class="checkout-btn" onclick="sendOrder()">Order via WhatsApp</button>
</div>

<script>
    let products = JSON.parse(localStorage.getItem('elite_luxe_db')) || [];
    let cart = [];
    let isStaff = false;

    // Login function using your saved password
    function login() {
        if(prompt("Enter PIN:") === "786786") {
            isStaff = true;
            document.getElementById('admin-panel').style.display = 'block';
            render();
        }
    }

    // Cloudinary Logic
    function openWidget() {
        if (typeof cloudinary === 'undefined') {
            alert("Script is still loading or blocked. Please refresh the page.");
            return;
        }

        cloudinary.openUploadWidget({
            cloudName: 'dfjshjp8t',
            uploadPreset: 'my_preset',
            sources: ['local', 'camera'],
            multiple: false
        }, (error, result) => {
            if (!error && result && result.event === "success") { 
                document.getElementById('pImg').value = result.info.secure_url;
                document.getElementById('saveBtn').disabled = false;
                document.getElementById('status').innerText = "✅ Image Uploaded!";
            }
        });
    }

    function saveProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const cat = document.getElementById('pCat').value;
        const img = document.getElementById('pImg').value;

        if(!name || !price || !img) return alert("Fill all details!");

        products.push({ id: Date.now(), name, price, cat, img });
        localStorage.setItem('elite_luxe_db', JSON.stringify(products));
        
        // Reset form
        document.getElementById('pName').value = "";
        document.getElementById('pPrice').value = "";
        document.getElementById('saveBtn').disabled = true;
        document.getElementById('status').innerText = "";
        
        render();
        alert("Success!");
    }

    function deleteItem(id) {
        if(confirm("Delete this?")) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('elite_luxe_db', JSON.stringify(products));
            render();
        }
    }

    function render() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";
        products.forEach(p => {
            grid.innerHTML += `
                <div class="card">
                    ${isStaff ? `<button onclick="deleteItem(${p.id})" style="position:absolute; top:10px; left:10px; background:red; color:white; border:none; padding:5px; cursor:pointer;">X</button>` : ''}
                    <img src="${p.img}">
                    <div style="padding:10px;">
                        <h3>${p.name}</h3>
                        <span class="price">₹${p.price}</span>
                        <button class="btn" style="width:100%" onclick="addToCart('${p.name}', ${p.price})">Add to Bag</button>
                    </div>
                </div>`;
        });
    }

    function addToCart(n, p) { cart.push({n, p}); updateCart(); toggleCart(); }
    function updateCart() {
        const list = document.getElementById('cart-list');
        let total = 0; list.innerHTML = "";
        cart.forEach(i => {
            total += parseInt(i.p);
            list.innerHTML += `<p style="display:flex; justify-content:space-between"><span>${i.n}</span> <span>₹${i.p}</span></p>`;
        });
        document.getElementById('total-price').innerText = total;
        document.getElementById('cart-count').innerText = cart.length;
    }

    function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('active'); }

    function sendOrder() {
        let phone = "91XXXXXXXXXX"; // Change to your number
        let msg = "*NEW ORDER*%0a";
        cart.forEach(i => { msg += `- ${i.n} (₹${i.p})%0a`; });
        msg += `*Total: ₹${document.getElementById('total-price').innerText}*`;
        window.open(`https://wa.me/${phone}?text=${msg}`);
    }

    render();
</script>
</body>
</html>
